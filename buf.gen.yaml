# buf.gen.yaml defines a local generation template.
# For details, see https://docs.buf.build/configuration/v1/buf-gen-yaml
version: v2
clean: true
inputs:
  - directory: protos
    paths:
      - protos/sk8l.proto
      - protos/sk8l_custom.proto
plugins:
  # This will invoke protoc-gen-es and write output to /usr/app/protos
  - local: protoc-gen-es
    out: /usr/app/protos
    include_imports: true
    opt:
      - target=ts
      - import_extension=.ts
