sk8lApi:
  image: "sk8l-api"
  imageTag: "e2e"
  imagePullPolicy: "IfNotPresent"
tls:
  enabled: false
service:
  type: NodePort
  labels:
    app: "sk8l"
  ports:
    - name: http
      port: 8590
      targetPort: http
      protocol: TCP
      nodePort: 30958
networkPolicy:
  enabled: false
grafanaDashboard:
  enabled: false
