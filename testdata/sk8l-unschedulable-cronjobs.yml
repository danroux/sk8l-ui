apiVersion: batch/v1
kind: CronJob
metadata:
  name: unschedulable-nodeselector
spec:
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      template:
        spec:
          nodeSelector:
            sk8l.io/does-not-exist: "true"
          containers:
            - name: worker
              image: busybox:1.36.1-glibc
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c", "echo should never schedule"]
          restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unschedulable-resources
spec:
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      template:
        spec:
          containers:
            - name: worker
              image: busybox:1.36.1-glibc
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c", "echo insufficient resources"]
              resources:
                requests:
                  cpu: "9999"
                  memory: "9999Gi"
                limits:
                  cpu: "9999"
                  memory: "9999Gi"
          restartPolicy: Never
