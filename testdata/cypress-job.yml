apiVersion: batch/v1
kind: Job
metadata:
  name: cypress-job
spec:
  template:
    spec:
      containers:
        - name: cypress
          image: ghcr.io/danroux/sk8l-ui:ui-test
          imagePullPolicy: Always
          command: ["cypress"]
          args: ["run", "--browser", "firefox:stable", "--headless", "--config-file=cypress.config.ts"]
          # command: ["/bin/sh"]
          # args: ["-c", "while true; do echo hello; sleep 120;done"]
          workingDir: /e2e
          volumeMounts:
            - name: xapp
              mountPath: /e2e/cypress/screenshots
      restartPolicy: Never
      volumes:
        - name: xapp
          hostPath:
            path: /xapp
            type: Directory
  backoffLimit: 0
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          containerName: cypress
          operator: NotIn
          values: [0]
          # operator: In
          # values: [1]
