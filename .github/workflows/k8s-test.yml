name: k8s-rwkld

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: number
      image_tag:
        required: true
        type: string
      kind_version:
        required: true
        type: string
      k8s_version:
        required: true
        type: string
      k8s_image:
        required: true
        type: string
jobs:
  k8s-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Download sk8l-api e2e image tar
        uses: actions/download-artifact@v7
        with:
          name: sk8l-api-e2e-${{ inputs.pull_request_number }}
      - name: Setup Kubernetes cluster ${{ inputs.kind_version }}/${{ inputs.k8s_version }}
        uses: helm/kind-action@v1.15.2
        with:
          cluster_name: "sk8l-${{ inputs.kind_version }}-${{ inputs.k8s_version }}-${{ inputs.image_tag }}"
          version: ${{ inputs.kind_version }}
          node_image: ${{ inputs.k8s_image }}
          config: testdata/sk8l-kind.yml
      - name: Test connection
        run: |
          kubectl cluster-info > /dev/null
          kubectl describe node > /dev/null
      - name: Load sk8l-api e2e image into Kind
        run: |
          kind load image-archive sk8l-api-e2e.tar --name "sk8l-${{ inputs.kind_version }}-${{ inputs.k8s_version }}-${{ inputs.image_tag }}"
      - name: Install Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: 'v3.13.3'
      - name: Install Chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          make install-chart-ci API_IMAGE_TAG="e2e-pr-${{ inputs.pull_request_number }}" > /dev/null
      - name: ui smoke tests
        id: ui_smoke_tests
        run: |
          ./ci/ui_smoke_tests.sh ghcr.io/danroux/sk8l-ui:ui-test-${{ inputs.pull_request_number }} # -${{ inputs.image_tag }}
      - name: ui smoke tests error output
        if: ${{ failure() && steps.ui_smoke_tests.conclusion == 'failure' }}
        run: |
          echo "----------------------------"
          kubectl get pods -n sk8l
          echo "----------------------------"
          kubectl get cronjobs -n sk8l
          echo "----------------------------"
          kubectl logs -n sk8l -l app.kubernetes.io/pod=sk8l-api --all-containers=true --tail=100 || true
          echo "----------------------------"
          kubectl describe pod -l job-name=cypress-job -n sk8l
          echo "----------------------------"
          kubectl get jobs cypress-job -n sk8l || true
          kubectl logs job.batch/cypress-job -n sk8l || true
          exit 1
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-job-ss-${{ github.job }}-${{ github.run_number }}-${{ github.run_id }}
          path: /home/runner/work/sk8l-ui/sk8l-ui/cypress/
