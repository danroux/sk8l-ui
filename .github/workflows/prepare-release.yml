name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      ui_version:
        description: 'UI Version (e.g. 0.20.0 or v0.20.0)'
        required: true
        default: '0.20.0'

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: '1.27.x'

      - name: Cache changelog-build
        id: cache-changelog-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/changelog-build
          key: ${{ runner.os }}-changelog-build-v0.0.0-20260907110944

      - name: Install changelog-build
        if: steps.cache-changelog-build.outputs.cache-hit != 'true'
        run: go install github.com/hashicorp/go-changelog/cmd/changelog-build@v0.0.0-20260907110944-10b1aebc564c

      - name: Install yq
        run: |
          if ! command -v yq &> /dev/null; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi

      - name: Normalize Version Variables
        id: vars
        run: |
          UI_RAW="${{ github.event.inputs.ui_version }}"
          UI_NUM="${UI_RAW#v}"
          UI_TAG="v${UI_NUM}"

          echo "ui_num=${UI_NUM}" >> "$GITHUB_OUTPUT"
          echo "ui_tag=${UI_TAG}" >> "$GITHUB_OUTPUT"

          IFS='.' read -r UI_MAJOR UI_MINOR UI_PATCH <<< "${UI_NUM}"
          echo "ui_major=${UI_MAJOR}" >> "$GITHUB_OUTPUT"
          echo "ui_minor=${UI_MINOR}" >> "$GITHUB_OUTPUT"
          echo "ui_patch=${UI_PATCH}" >> "$GITHUB_OUTPUT"

      - name: Update Makefile & package.json Versions
        run: |
          sed -i -E "s/VERSION_MAJOR \?= [0-9]+/VERSION_MAJOR ?= ${{ steps.vars.outputs.ui_major }}/" Makefile
          sed -i -E "s/VERSION_MINOR \?= [0-9]+/VERSION_MINOR ?= ${{ steps.vars.outputs.ui_minor }}/" Makefile
          sed -i -E "s/VERSION_PATCH \?= [0-9]+/VERSION_PATCH ?= ${{ steps.vars.outputs.ui_patch }}/" Makefile
          sed -i -E 's/"version": "[^"]+"/"version": "${{ steps.vars.outputs.ui_num }}"/' package.json

      - name: Generate Changelog & Update CHANGELOG.md
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="release-${{ steps.vars.outputs.ui_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH_NAME}"

          LAST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "")
          echo "Generating notes from ${LAST_TAG} to HEAD"

          mkdir -p .changelog
          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"
          for SHA in $(git log "${RANGE}" --no-merges --reverse --pretty=format:"%H"); do
            AUTHOR=$(git log -1 --pretty=format:"%an <%ae>" "$SHA")
            COMMIT_BODY=$(git log -1 --pretty=format:"%B" "$SHA")
            if [[ "$AUTHOR" != *"dependabot"* ]] && [[ "$COMMIT_BODY" != *"Signed-off-by: dependabot[bot]"* ]]; then
              continue
            fi

            SUBJECT=$(git log -1 --pretty=format:%s "$SHA")
            COMMIT_FILES=$(git diff-tree --no-commit-id --name-only -r "$SHA")
            if [[ "$SUBJECT" == gha:* ]] || ( [ -n "$COMMIT_FILES" ] && ! echo "$COMMIT_FILES" | grep -qvE '^(\.github/|ci/|\.devcontainer/)' ); then
              echo "Skipping CI/internal Dependabot commit ${SHA} (${SUBJECT})."
              continue
            fi

            if ! PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${SHA}/pulls" 2>/dev/null); then
              PR_JSON="[]"
            fi

            NO_CHANGELOG=$(echo "$PR_JSON" | jq -r '[.[] | select(.merged_at != null)][0].labels // [] | map(.name) | index("pr/no-changelog") != null')
            if [ "$NO_CHANGELOG" = "true" ]; then
              echo "Skipping Dependabot commit ${SHA}: PR has 'pr/no-changelog' label."
              continue
            fi

            PR_NUM=$(echo "$PR_JSON" | jq -r '[.[] | select(.merged_at != null)][0].number // empty')
            if [ -z "$PR_NUM" ]; then
              PR_NUM=$(echo "$SUBJECT" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')
            fi
            if [ -z "$PR_NUM" ]; then
              echo "::error::Could not determine PR number for Dependabot commit ${SHA} (${SUBJECT})."
              exit 1
            fi

            FILE=".changelog/${PR_NUM}.txt"
            if [ ! -f "$FILE" ]; then
              TITLE=$(echo "$PR_JSON" | jq -r '[.[] | select(.merged_at != null)][0].title // empty')
              if [ -z "$TITLE" ]; then
                TITLE=$(echo "$SUBJECT" | sed -E "s/ \(#${PR_NUM}\)$//")
              fi
              TITLE=$(echo "$TITLE" | tr -d '\r\n' | sed 's/```//g')
              printf '```release-note:dependency\nci/dependabot: %s\n```\n' "$TITLE" > "$FILE"
              echo "Generated missing Dependabot changelog entry: $FILE"
            fi
          done

          if [ -n "$(git status --porcelain .changelog/)" ]; then
            git add .changelog/
            git commit -m "changelog: add Dependabot entries for ${{ steps.vars.outputs.ui_tag }}"
          fi

          RAW_NOTES=$(changelog-build \
            -last-release "${LAST_TAG}" \
            -entries-dir .changelog/ \
            -changelog-template .changelog/changelog.tmpl \
            -note-template .changelog/note.tmpl \
            -this-release HEAD)

          chmod +x ci/clean_changelog.sh
          NOTES=$(echo "${RAW_NOTES}" | ./ci/clean_changelog.sh)

          if [ -n "${LAST_TAG}" ] && [ -n "$(git diff --name-only "${LAST_TAG}" HEAD -- '.changelog/*.txt')" ] && [ -z "$(echo "${NOTES}" | tr -d '[:space:]')" ]; then
            echo "::error::Changelog entries exist since ${LAST_TAG}, but generated release notes are empty."
            exit 1
          fi

          RELEASE_DATE=$(date '+%B %d, %Y')
          HEADER="## ${{ steps.vars.outputs.ui_tag }} (${RELEASE_DATE})"

          TEMP_CHANGELOG=$(mktemp)
          printf "%s\n\n%s\n\n%s" "${HEADER}" "${NOTES}" "$(cat CHANGELOG.md)" > "${TEMP_CHANGELOG}"
          mv "${TEMP_CHANGELOG}" CHANGELOG.md

          # Save notes for PR description
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "${NOTES}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="release-${{ steps.vars.outputs.ui_tag }}"
          TITLE="Release ${{ steps.vars.outputs.ui_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git reset --soft origin/main
          git add Makefile CHANGELOG.md package.json .changelog/
          MSG_FILE=$(mktemp)
          printf "%s\n\n%s\n" "${TITLE}" "${{ steps.changelog.outputs.notes }}" > "${MSG_FILE}"
          git commit -F "${MSG_FILE}"
          rm -f "${MSG_FILE}"
          git push origin "${BRANCH_NAME}" --force

          BODY=$(printf "### %s\n\n%s" "${TITLE}" "${{ steps.changelog.outputs.notes }}")
          gh pr create --title "${TITLE}" --body "${BODY}" --base main --head "${BRANCH_NAME}" --label "pr/no-changelog" || \
            gh pr edit "${BRANCH_NAME}" --title "${TITLE}" --body "${BODY}" || true
