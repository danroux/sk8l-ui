name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Determine Tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags
            LATEST=$(git tag -l --sort=-v:refname | head -n 1)
            echo "name=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Release Notes
        run: |
          latest_entry=$(sed -n '/^##/,$p' CHANGELOG.md | awk '/^##/ {if (version) {print entry; exit} version=$0} {entry = entry ORS $0}')
          echo "$latest_entry" > release-notes.md

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

      - name: GH Release
        run: |
          gh release create "${{ steps.tag.outputs.name }}" --notes-file release-notes.md --title "${{ steps.tag.outputs.name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
