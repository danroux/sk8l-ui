name: Preview Environment

on:
  pull_request_target:
    types: [labeled, unlabeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  preview:
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'deploy-preview') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'deploy-preview') ||
      (github.event.action == 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sk8l-api UI preview workflow
        if: github.event.action == 'labeled' && github.event.label.name == 'deploy-preview'
        env:
          GH_TOKEN: ${{ secrets.UI_PREVIEW_PAT }}
        run: |
          gh workflow run ui-preview.yml \
            --repo danroux/sk8l-api \
            -f ui_pr_number="${{ github.event.pull_request.number }}"

      - name: Checkout sk8l-config
        if: |
          (github.event.action == 'unlabeled' && github.event.label.name == 'deploy-preview') ||
          (github.event.action == 'closed')
        uses: actions/checkout@v7.0.1
        with:
          repository: danroux/sk8l-config
          token: ${{ secrets.CONFIG_REPO_PAT }}
          ref: master

      - name: Teardown Preview Manifest
        if: |
          (github.event.action == 'unlabeled' && github.event.label.name == 'deploy-preview') ||
          (github.event.action == 'closed')
        env:
          GH_TOKEN: ${{ secrets.UI_PREVIEW_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          NAMESPACE="sk8l-ui-pr-${PR_NUM}"
          FILE="apps/previews/ui-pr-${PR_NUM}.yaml"

          if [ -f "$FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm "$FILE"
            git commit -m "chore(preview): teardown preview for sk8l-ui PR #${PR_NUM}"
            git pull --rebase origin master
            git push origin master

            MARKER="<!-- sk8l-preview -->"
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            {
              echo "${MARKER}"
              echo "🧹 **Preview environment destroyed.**"
              echo ""
              echo "- **Namespace**: \`${NAMESPACE}\`"
              echo "- **Updated**: ${TIMESTAMP}"
            } > /tmp/preview-comment.md

            COMMENT_ID=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUM}/comments?per_page=100" \
              --jq ".[] | select((.body // \"\") | contains(\"${MARKER}\")) | .id" | head -n 1 || true)
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -f body="$(cat /tmp/preview-comment.md)" >/dev/null || true
            else
              gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUM}/comments" -f body="$(cat /tmp/preview-comment.md)" >/dev/null || true
            fi
          fi
